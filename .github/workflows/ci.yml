# Continuous integration for the Go side.
#
# THE TESTS RUN AGAINST A REAL POSTGRES, not a fake. What most of them check is
# a query and a refusal, and a fake store would only prove that the fake
# refuses. The service container costs a few seconds and removes a whole class
# of test that passes while the thing it stands for is broken.
#
# `golangci-lint` runs BEFORE the tests, and that order is deliberate: it is
# the step that catches what `go build` and `go vet` do not, and finding it in
# ten seconds is better than finding it after the database has started.

name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # The release calls this workflow rather than repeating its steps. A release
  # that ran "the same checks" written out a second time would be one edit away
  # from running different ones, and the edit nobody makes to both is exactly
  # the failure this repository keeps meeting.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHICH OF THE JOBS BELOW THIS CHANGE CAN POSSIBLY AFFECT.
  #
  # One repository holds the API, the interface, the content, the tools, the
  # infrastructure and the documents (P-02), and that is the right shape — the
  # boundary between repositories matched no boundary in the system, and the
  # predecessor paid for it with a stylesheet in three copies and a contract
  # change costing two pull requests.
  #
  # What it costs is this: a comment in a `.tf` file used to run a Go suite, a
  # database and fifteen minutes of browser. Four of the last six pull requests
  # here touched only `infra/` and `docs/`.
  #
  # IT IS `if` ON EACH JOB AND NOT `paths:` ON THE WORKFLOW. A job skipped by
  # `if` reports as skipped, which a required check accepts; a workflow filtered
  # by `paths:` never reports at all, and a required check that never reports
  # blocks the merge forever. The second is a trap that only springs once
  # branch protection is on, which is after the person who wrote it has moved
  # on.
  #
  # IT FAILS OPEN. Anything that is not a pull request — a push to main, and a
  # release, which calls this workflow — runs everything. So does a diff that
  # cannot be computed. A detector that guesses wrong should waste a runner,
  # never skip a suite.
  Changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.what.outputs.go }}
      browser: ${{ steps.what.outputs.browser }}
    steps:
      # The whole history, because the diff is against the base commit and a
      # shallow clone does not have it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: what
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          everything() {
            echo "go=true"      >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          [ "${{ github.event_name }}" = "pull_request" ] || \
            everything "not a pull request — running everything"

          changed="$(git diff --name-only "$BASE...$HEAD")" || \
            everything "could not diff $BASE...$HEAD — running everything"
          [ -n "$changed" ] || everything "no files in the diff — running everything"

          echo "changed:"
          echo "$changed" | sed 's/^/  /'

          # `ui/` is in the Go set because the API embeds it and
          # `check-interface` reads it — a string added without its Portuguese
          # is a Go failure here, not a browser one.
          go='^(internal/|cmd/|tools/|migrations/|content/|ui/|go\.(mod|sum)$|\.golangci\.yml$|\.github/workflows/ci\.yml$)'

          # The browser suite renders the interface against a real schema, so
          # it wants everything that reaches a screen. `tools/` is narrowed to
          # the four it actually runs.
          browser='^(ui/|content/|migrations/|internal/|cmd/|package(-lock)?\.json$|go\.(mod|sum)$|tools/(graph-test|a11y-test|bundle|bundle-test)/|\.github/workflows/ci\.yml$)'

          for name in go browser; do
            eval "pattern=\$$name"
            if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "skipping $name: nothing it reads has changed"
            fi
          done

  Go:
    needs: Changes
    if: needs.Changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schooling
          POSTGRES_PASSWORD: schooling
          POSTGRES_DB: schooling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooling -d schooling_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      SCHOOLING_TEST_DATABASE_URL: postgres://schooling:schooling@localhost:5432/schooling_test?sslmode=disable

      # No silent toolchain downloads. Left at the default, Go quietly fetches
      # whatever version go.mod asks for, and CI then tests a compiler nobody
      # chose — which is precisely how the mismatch above went unnoticed. With
      # `local`, a go.mod that outgrows the installed toolchain fails on the
      # first build, saying so in one line.
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # THE VERSION COMES FROM go.mod AND NOWHERE ELSE. Written here as a
      # literal it drifted within a day: the local toolchain bumped the
      # directive to 1.25 during a `go mod tidy`, CI kept installing 1.24, and
      # the failure surfaced as a linter complaining about a config file.
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod

      - name: The formatting is the tool's, not a person's
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # golangci-lint refuses to run when the Go it was built with is older
      # than the one go.mod targets, so this version is not free to lag behind
      # the directive. It is the version that runs on a developer's machine;
      # raising go.mod means raising this on the same commit.
      #
      # `verify` IS OFF BECAUSE IT IS A NETWORK CALL. It checks `.golangci.yml`
      # against a JSON schema the action downloads from golangci-lint.run at
      # run time, and when that site is slow the step fails with
      # "context deadline exceeded" — a green branch turned red by somebody
      # else's web server, with nothing in the repository changed. It happened
      # on the first pull request that went near it.
      #
      # What it would have caught, the tool catches anyway: a key the linter
      # does not know is an error when the linter reads the file. This gives up
      # a better message for that mistake, and takes CI off a third party's
      # uptime in exchange.
      - name: Nothing drops an error on the floor
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5.0
          verify: false

      - name: It builds
        run: go build ./...

      - name: Apply the schema, as a job — the same shape production uses
        run: go run ./cmd/migrate
        env:
          SCHOOLING_DATABASE_URL: ${{ env.SCHOOLING_TEST_DATABASE_URL }}
          SCHOOLING_PLATFORM_DOMAIN: example.tld
          SCHOOLING_ENV: development

      - name: Running it twice changes nothing
        run: go run ./cmd/migrate
        env:
          SCHOOLING_DATABASE_URL: ${{ env.SCHOOLING_TEST_DATABASE_URL }}
          SCHOOLING_PLATFORM_DOMAIN: example.tld
          SCHOOLING_ENV: development

      # THE RESTORE DRILL IS NOT RUN HERE — it clones production, costs money
      # and takes a quarter of an hour. What runs here is the question it asks,
      # against this schema, because that is the half that rots: `verify.sql`
      # reads `information_schema` and `pg_constraint`, and a drill whose query
      # had stopped parsing would say so on the morning somebody needs a
      # restore. Ten seconds now against that.
      #
      # Twice, and the two runs have to be identical once the snapshot line is
      # taken out. The whole verdict is a `diff` between two databases, so a
      # result Postgres was free to order differently would read as a failed
      # restore when it is a failed query.
      #
      # The snapshot line is the one that is SUPPOSED to differ — it carries the
      # instant the report was taken, which is how the drill restores a clone to
      # the same moment it read live at. It is checked for presence and then
      # dropped, exactly as the drill drops it.
      - name: The restore drill's question still runs
        run: |
          for run in once twice; do
            psql "$SCHOOLING_TEST_DATABASE_URL" -qtAX -v ON_ERROR_STOP=1 \
              -f tools/restore-drill/verify.sql > "/tmp/$run.txt"
            # RFC3339 to the second, because `gcloud sql instances clone
            # --point-in-time` is handed this string verbatim.
            grep -Eq '^snapshot\|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' "/tmp/$run.txt"
            sed -i '/^snapshot|/d' "/tmp/$run.txt"
          done
          diff -u /tmp/once.txt /tmp/twice.txt
          grep -q '^migration|' /tmp/once.txt
          grep -q '^rows|schema_migrations|' /tmp/once.txt
          echo "$(wc -l < /tmp/once.txt) lines describe this schema"

      # THE REVIEWER, over the files, before anything reaches a database.
      #
      # There is no human one: the material is written by a machine, and this is
      # what stands between a wrong answer key and a student. It is early in the
      # list on purpose — it needs no database and it is the check whose absence
      # costs the most.
      - name: The catalogue is coherent
        run: go run ./tools/validate-content

      # The same job, on the interface rather than on the content. A string
      # added without its Portuguese works perfectly — in the wrong language,
      # for half the students, until one of them mentions it. Nothing else in
      # this list can see that.
      - name: The interface speaks every language it claims to
        run: go run ./tools/check-interface

      - name: The tests, with a database behind them
        run: go test -race ./...

      # THE ANALYSIS JOB, RUN AGAINST AN EMPTY STREAM. It does almost nothing
      # here and that is the point: a job that only ever runs on a schedule is
      # a job whose first failure is at three in the morning, in production, on
      # the day somebody changed a column it reads. This is the cheapest place
      # to find out that it still starts, connects and finishes.
      #
      # It is exercised for real by the tests above, which hand it answers and
      # check the verdicts.
      - name: The item analysis still runs
        run: go run ./cmd/analyse
        env:
          SCHOOLING_DATABASE_URL: ${{ env.SCHOOLING_TEST_DATABASE_URL }}
          SCHOOLING_PLATFORM_DOMAIN: example.tld
          SCHOOLING_ENV: development

      # The dependency graph between modules is a rule the code has to obey,
      # not an agreement — and it is in the run above. This step exists to
      # report it by name, so that a failure here reads as "a boundary was
      # crossed" rather than as a test somewhere in a list.
      - name: The module boundaries hold
        run: go test -run 'TestPlatformImportsNothing|TestNoModuleImportsAnotherModule' -v ./internal/

  # WHAT ONLY A REAL BROWSER CAN ANSWER, and its own job for two reasons: it
  # needs one, which is a minute of setup the Go job should not pay for; and
  # when it fails it fails on its own, so "the interface is wrong" and "the
  # server is wrong" are two red marks rather than one.
  #
  # Two suites share the job because they share the setup exactly: a schema, a
  # school to look at, and a server. Splitting them would be paying for that
  # twice to learn the same thing.
  Browser:
    needs: Changes
    if: needs.Changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schooling
          POSTGRES_PASSWORD: schooling
          POSTGRES_DB: schooling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooling -d schooling_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      GOTOOLCHAIN: local
      SCHOOLING_DATABASE_URL: postgres://schooling:schooling@localhost:5432/schooling_test?sslmode=disable
      SCHOOLING_PLATFORM_DOMAIN: example.tld
      SCHOOLING_ENV: development
      PORT: "8099"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      # `npm ci` and not `npm install`: the lock file is the version that was
      # tested, and a browser suite that silently upgraded its driver would fail
      # on a day nobody changed anything.
      #
      # AND NOT `--with-deps`. That flag runs `apt-get update && apt-get
      # install` on every run, and the runner image already has every library
      # it asks for — the first run's log said "is already the newest version"
      # for all of them, and the only new packages were fonts this test does
      # not depend on. The second run then hung on that step for twenty
      # minutes, having taken seventy-five seconds on the first. A minute of
      # network for packages that are already there is not worth the class of
      # failure it brings with it.
      #
      # The timeout is the other half: if this ever hangs again it should say
      # so in three minutes rather than eat the job's whole budget and time out
      # somewhere less obvious.
      - name: The browser
        timeout-minutes: 5
        run: |
          npm ci
          npx playwright install chromium

      - name: The schema
        run: go run ./cmd/migrate

      # Until `content/` has a school in it there is nothing to look at, and
      # both suites would pass by having no work to do. The fixture is the
      # smallest track where a broken router and a working one produce
      # different drawings, and it carries the lesson and the exam the
      # accessibility pass needs a screen of — see the file.
      #
      # The school it seeds is named on the command line, because the local
      # stack seeds the same fixture under a different name. Both suites read
      # `code.example.tld`, so that is what this one passes.
      - name: Something to look at
        run: |
          psql "$SCHOOLING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v slug=graphtest -v host=code.example.tld \
            -f tools/graph-test/fixture.sql

      # BOTH SUITES, AGAINST ONE SERVER.
      #
      # The graph: every track, six window sizes, no line through a card. Two
      # lines crossing each OTHER is not checked — the ordering minimises those
      # and a graph can be non-planar, so demanding zero would be demanding the
      # impossible. A line through a card is always avoidable.
      #
      # Then axe, over every screen in both themes. It found a real defect on
      # its first run: `opacity` on a locked card took its text to 4.09:1 in the
      # dark theme and 3.32:1 in the light one, where AA asks for 4.5.
      #
      # The server is started HERE rather than in a step of its own, because a
      # background process belongs to the shell that started it and each step
      # gets a new one. Started beside the things that need it, there is no
      # question about whether it is still running.
      - name: The interface, in a browser
        run: |
          go run ./cmd/api &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:$PORT/readyz" && break
            sleep 1
          done
          curl -sf -o /dev/null "http://localhost:$PORT/readyz" || {
            echo "the server never became ready"; exit 1; }

          node tools/graph-test/graph-test.mjs
          node tools/a11y-test/a11y-test.mjs

          # BUILT AND OPENED, and the second half is the half that finds
          # things. Every way the bundler can fail produces a file: an
          # unescaped `</script` that ends the page halfway, a module linked in
          # the wrong order, a font whose relative URL means nothing once the
          # stylesheet is inline, a lesson whose key differs from the one the
          # client asks for by a single `?lang=`. All of them exit zero and all
          # of them open to a blank screen.
          #
          # It also counts the requests. The property the whole design rests on
          # is that a bundle opened from a file asks nobody for anything, and
          # that is invisible in the markup and in a screenshot — it is visible
          # in the network log.
          go run ./tools/bundle -host code.example.tld -out bundle.html
          node tools/bundle-test/bundle-test.mjs bundle.html
