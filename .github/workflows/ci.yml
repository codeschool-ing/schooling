# Continuous integration for the Go side.
#
# THE TESTS RUN AGAINST A REAL POSTGRES, not a fake. What most of them check is
# a query and a refusal, and a fake store would only prove that the fake
# refuses. The service container costs a few seconds and removes a whole class
# of test that passes while the thing it stands for is broken.
#
# `golangci-lint` runs BEFORE the tests, and that order is deliberate: it is
# the step that catches what `go build` and `go vet` do not, and finding it in
# ten seconds is better than finding it after the database has started.

name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # The release calls this workflow rather than repeating its steps. A release
  # that ran "the same checks" written out a second time would be one edit away
  # from running different ones, and the edit nobody makes to both is exactly
  # the failure this repository keeps meeting.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Go:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schooling
          POSTGRES_PASSWORD: schooling
          POSTGRES_DB: schooling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooling -d schooling_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      SCHOOLING_TEST_DATABASE_URL: postgres://schooling:schooling@localhost:5432/schooling_test?sslmode=disable

      # No silent toolchain downloads. Left at the default, Go quietly fetches
      # whatever version go.mod asks for, and CI then tests a compiler nobody
      # chose — which is precisely how the mismatch above went unnoticed. With
      # `local`, a go.mod that outgrows the installed toolchain fails on the
      # first build, saying so in one line.
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # THE VERSION COMES FROM go.mod AND NOWHERE ELSE. Written here as a
      # literal it drifted within a day: the local toolchain bumped the
      # directive to 1.25 during a `go mod tidy`, CI kept installing 1.24, and
      # the failure surfaced as a linter complaining about a config file.
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod

      - name: The formatting is the tool's, not a person's
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # golangci-lint refuses to run when the Go it was built with is older
      # than the one go.mod targets, so this version is not free to lag behind
      # the directive. It is the version that runs on a developer's machine;
      # raising go.mod means raising this on the same commit.
      - name: Nothing drops an error on the floor
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5.0

      - name: It builds
        run: go build ./...

      - name: Apply the schema, as a job — the same shape production uses
        run: go run ./cmd/migrate
        env:
          SCHOOLING_DATABASE_URL: ${{ env.SCHOOLING_TEST_DATABASE_URL }}
          SCHOOLING_PLATFORM_DOMAIN: example.tld
          SCHOOLING_ENV: development

      - name: Running it twice changes nothing
        run: go run ./cmd/migrate
        env:
          SCHOOLING_DATABASE_URL: ${{ env.SCHOOLING_TEST_DATABASE_URL }}
          SCHOOLING_PLATFORM_DOMAIN: example.tld
          SCHOOLING_ENV: development

      # THE REVIEWER, over the files, before anything reaches a database.
      #
      # There is no human one: the material is written by a machine, and this is
      # what stands between a wrong answer key and a student. It is early in the
      # list on purpose — it needs no database and it is the check whose absence
      # costs the most.
      - name: The catalogue is coherent
        run: go run ./tools/validate-content

      # The same job, on the interface rather than on the content. A string
      # added without its Portuguese works perfectly — in the wrong language,
      # for half the students, until one of them mentions it. Nothing else in
      # this list can see that.
      - name: The interface speaks every language it claims to
        run: go run ./tools/check-interface

      - name: The tests, with a database behind them
        run: go test -race ./...

      # The dependency graph between modules is a rule the code has to obey,
      # not an agreement — and it is in the run above. This step exists to
      # report it by name, so that a failure here reads as "a boundary was
      # crossed" rather than as a test somewhere in a list.
      - name: The module boundaries hold
        run: go test -run 'TestPlatformImportsNothing|TestNoModuleImportsAnotherModule' -v ./internal/

  # THE DRAWING, IN A REAL BROWSER, and its own job for two reasons: it needs a
  # browser, which is a minute of setup the Go job should not pay for; and when
  # it fails it fails on its own, so "the graph is wrong" and "the server is
  # wrong" are two red marks rather than one.
  Graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schooling
          POSTGRES_PASSWORD: schooling
          POSTGRES_DB: schooling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooling -d schooling_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      GOTOOLCHAIN: local
      SCHOOLING_DATABASE_URL: postgres://schooling:schooling@localhost:5432/schooling_test?sslmode=disable
      SCHOOLING_PLATFORM_DOMAIN: example.tld
      SCHOOLING_ENV: development
      PORT: "8099"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      # `npm ci` and not `npm install`: the lock file is the version that was
      # tested, and a browser suite that silently upgraded its driver would fail
      # on a day nobody changed anything.
      - name: The browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: The schema
        run: go run ./cmd/migrate

      # Until `content/` has a school in it there is nothing to draw, and the
      # test would pass by having no work to do. The fixture is the smallest
      # track where a broken router and a working one produce different
      # drawings — see the file.
      - name: Something to draw
        run: psql "$SCHOOLING_DATABASE_URL" -v ON_ERROR_STOP=1 -f tools/graph-test/fixture.sql

      # Every track, six window sizes, and no line through a card. Two lines
      # crossing each OTHER is not checked: the ordering minimises those and a
      # graph can be non-planar, so demanding zero would be demanding the
      # impossible. A line through a card is always avoidable.
      #
      # The server is started HERE rather than in a step of its own, because a
      # background process belongs to the shell that started it and each step
      # gets a new one. Started beside the thing that needs it, there is no
      # question about whether it is still running.
      - name: No line runs through a card
        run: |
          go run ./cmd/api &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:$PORT/readyz" && break
            sleep 1
          done
          curl -sf -o /dev/null "http://localhost:$PORT/readyz" || {
            echo "the server never became ready"; exit 1; }

          node tools/graph-test/graph-test.mjs
