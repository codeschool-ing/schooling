# The first check, and for now the only one, because there is no code yet.
#
# It exists because the four documents cross-reference each other by relative
# path — the README points at the plan, the plan points back at CLAUDE.md — and
# a link that stops resolving is the quietest kind of rot: it renders fine on
# GitHub as a link, and only fails when somebody clicks it.
#
# The moment a Go file lands, this workflow gains company. It does not gain
# ceremony before then: a workflow that checks nothing would be theatre, and
# a green tick that means nothing is worse than no tick.

name: Documents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# THIS ONE IS NOT FILTERED BY PATH, and that is the filtering decision rather
# than an omission of it.
#
# `ci.yml` skips the jobs whose inputs did not change. The input HERE is the
# whole repository: this walks every `.md` and asks whether each relative link
# resolves to a file that exists, so a link breaks when its TARGET moves or is
# deleted — and the target is usually not a `.md`. A filter on `*.md` would
# skip precisely the change that breaks a link.
#
# It also takes five seconds and needs no database and no browser. There is
# nothing to save.

jobs:
  Links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Every relative link resolves to a file that exists
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          # [text](target) where the target is not a URL and not an anchor
          LINK = re.compile(r'\[[^\]]*\]\(([^)#][^)]*)\)')
          broken = []

          for md in pathlib.Path('.').rglob('*.md'):
              for line, text in enumerate(md.read_text().splitlines(), 1):
                  for target in LINK.findall(text):
                      if '://' in target or target.startswith('mailto:'):
                          continue
                      path = target.split('#', 1)[0]
                      if not path:
                          continue
                      if not (md.parent / path).resolve().exists():
                          broken.append(f'{md}:{line}  ->  {target}')

          if broken:
              print('broken relative links:')
              print('\n'.join('  ' + b for b in broken))
              sys.exit(1)
          print('OK — every relative link resolves')
          PY

      # THE CURRENT FORMAT IS WHATEVER THE NEWEST SHEET DECLARES, and there is
      # deliberately no constant anywhere saying which one that is. A constant
      # would be a second place to state the same fact, and it would disagree
      # with the sheets the first time somebody bumped one file and stopped.
      #
      # So raising the format on one sheet is what fails the others, by name.
      # That is the point rather than a side effect: a sheet left at an older
      # format looks finished and is missing fields nobody remembers.
      #
      # Coverage is REPORTED AND NOT ENFORCED. The sweep is partial on purpose
      # for a long time, and a check that failed on the courses without a sheet
      # would be a red build describing a plan working as intended.
      - name: Every design sheet is at the current format
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          sheets = sorted(pathlib.Path('docs/design').glob('*.md'))
          sheets = [s for s in sheets if s.name != 'README.md']
          if not sheets:
              print('no design sheets'); raise SystemExit(0)

          courses = {json.loads(p.read_text())['slug']
                     for p in pathlib.Path('content').rglob('courses/*/course.json')
                     if not p.name.endswith('.pt.json')}

          FRONT = re.compile(r'\A---\n(.*?)\n---\n', re.S)
          problems, seen, formats = [], {}, {}

          for sheet in sheets:
              text = sheet.read_text()
              m = FRONT.match(text)
              if not m:
                  problems.append(f'{sheet}: no front matter — a sheet with no format '
                                  f'cannot be told apart from a current one')
                  continue
              front = dict(
                  (k.strip(), v.strip())
                  for k, _, v in (l.partition(':') for l in m.group(1).splitlines() if l.strip()))

              for key in ('format', 'course'):
                  if key not in front:
                      problems.append(f'{sheet}: front matter has no `{key}`')
              if 'format' in front:
                  if not front['format'].isdigit():
                      problems.append(f'{sheet}: format {front["format"]!r} is not a whole number')
                  else:
                      formats[sheet] = int(front['format'])
              if 'course' in front:
                  slug = front['course']
                  if slug not in courses:
                      problems.append(f'{sheet}: names the course {slug!r}, which is not in '
                                      f'content/ — a sheet for a course that was renamed is a '
                                      f'sheet nobody will find')
                  if slug in seen:
                      problems.append(f'{sheet}: names {slug!r}, and so does {seen[slug]}')
                  seen[slug] = sheet

          if formats:
              current = max(formats.values())
              behind = sorted(s for s, f in formats.items() if f < current)
              if behind:
                  problems.append(
                      f'the current format is {current}, and these are behind it — bring them up '
                      f'or the register is half migrated:')
                  problems += [f'    {s}  (format {formats[s]})' for s in behind]

              # A SHEET WHOSE SECTIONS ARE DESIGNED STATES THEM TWICE — once as
              # a numbered list and once as a total in `Shape` — and two
              # statements of one fact drift. So they are compared, along with
              # the numbering itself: a gap or a repeat in 1..N is the silent
              # kind of defect, since the list still reads as a list.
              SECTION = re.compile(r'^\| (\d+) \| `[^`]+` \| (\w+) \|', re.M)
              SHAPE = re.compile(r'\| sections \| \*\*(\d+)\*\* — (\d+) reading, '
                                 r'(\d+) video, (\d+) practice')

              for sheet in sheets:
                  rows = SECTION.findall(sheet.read_text())
                  if not rows:
                      continue
                  numbers = [int(n) for n, _ in rows]
                  if numbers != list(range(1, len(numbers) + 1)):
                      missing = [i for i in range(1, len(numbers) + 1) if i not in numbers]
                      repeated = sorted({n for n in numbers if numbers.count(n) > 1})
                      problems.append(
                          f'{sheet}: the section numbering is not 1..{len(numbers)} — '
                          f'missing {missing or "nothing"}, repeated {repeated or "nothing"}')

                  shape = SHAPE.search(sheet.read_text())
                  if not shape:
                      problems.append(f'{sheet}: has a section list and no `sections` line in '
                                      f'Shape to check it against')
                      continue
                  said = tuple(int(g) for g in shape.groups())
                  kinds = [k for _, k in rows]
                  counted = (len(rows), kinds.count('reading'),
                             kinds.count('video'), kinds.count('practice'))
                  if said != counted:
                      problems.append(
                          f'{sheet}: Shape says {said[0]} sections '
                          f'({said[1]} reading, {said[2]} video, {said[3]} practice) and the '
                          f'list holds {counted[0]} ({counted[1]}, {counted[2]}, {counted[3]})')

          if problems:
              print('design sheets:')
              print('\n'.join('  ' + p for p in problems))
              sys.exit(1)

          print(f'OK — {len(sheets)} design sheet(s) at format {max(formats.values())}; '
                f'{len(courses) - len(seen)} of {len(courses)} courses have none yet')
          PY
