# The first check, and for now the only one, because there is no code yet.
#
# It exists because the four documents cross-reference each other by relative
# path — the README points at the plan, the plan points back at CLAUDE.md — and
# a link that stops resolving is the quietest kind of rot: it renders fine on
# GitHub as a link, and only fails when somebody clicks it.
#
# The moment a Go file lands, this workflow gains company. It does not gain
# ceremony before then: a workflow that checks nothing would be theatre, and
# a green tick that means nothing is worse than no tick.

name: Documents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# THIS ONE IS NOT FILTERED BY PATH, and that is the filtering decision rather
# than an omission of it.
#
# `ci.yml` skips the jobs whose inputs did not change. The input HERE is the
# whole repository: this walks every `.md` and asks whether each relative link
# resolves to a file that exists, so a link breaks when its TARGET moves or is
# deleted — and the target is usually not a `.md`. A filter on `*.md` would
# skip precisely the change that breaks a link.
#
# It also takes five seconds and needs no database and no browser. There is
# nothing to save.

jobs:
  Links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Every relative link resolves to a file that exists
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          # [text](target) where the target is not a URL and not an anchor
          LINK = re.compile(r'\[[^\]]*\]\(([^)#][^)]*)\)')
          broken = []

          for md in pathlib.Path('.').rglob('*.md'):
              for line, text in enumerate(md.read_text().splitlines(), 1):
                  for target in LINK.findall(text):
                      if '://' in target or target.startswith('mailto:'):
                          continue
                      path = target.split('#', 1)[0]
                      if not path:
                          continue
                      if not (md.parent / path).resolve().exists():
                          broken.append(f'{md}:{line}  ->  {target}')

          if broken:
              print('broken relative links:')
              print('\n'.join('  ' + b for b in broken))
              sys.exit(1)
          print('OK — every relative link resolves')
          PY

      # THE ASYMMETRY THE LINK CHECK LEAVES OPEN. That one fails when the README
      # points at a document that is gone. It says nothing about the opposite —
      # a document that EXISTS and nobody lists — because there is no link to
      # walk, and an unlisted document is invisible in exactly the way a broken
      # link is not: it renders nothing, breaks nothing, and is simply never
      # read.
      #
      # Two rows in the README once promised `docs/adr/` and `docs/DEPLOY.md`,
      # which were never written; neither was a link, so nothing caught it. This
      # is the same defect from the other side, and it is the orphan check
      # `validate-content` already runs on sections nobody references.
      - name: Every document under docs/ is listed in the README
        run: |
          python3 - <<'PY'
          import pathlib, sys

          readme = pathlib.Path('README.md').read_text()
          orphans = [str(p) for p in sorted(pathlib.Path('docs').glob('*.md'))
                     if str(p) not in readme]

          if orphans:
              print('documents nobody lists:')
              print('\n'.join('  ' + o for o in orphans))
              print('\nAdd a row to the table in README.md. A document that is not listed is '
                    'not findable, and writing it was the expensive part.')
              sys.exit(1)
          print(f'OK — every document under docs/ is named in README.md')
          PY

      # THE DESIGN SHEETS ARE `tools/check-design`, and this step was them.
      #
      # It was a Python heredoc here: the front matter, the format register, a
      # sheet naming a course that is not in `content/`, and a sheet's section
      # list against its own `Shape` total. Every one of those is still checked
      # and none of them is checked here, because the tool that replaced it also
      # compares a sheet to the COURSE — the id, the lesson count against
      # `topics` — and two of the rules were then being made twice, in two
      # languages, in two files.
      #
      # WHAT MOVING THEM BOUGHT is that they can be run before pushing. A
      # heredoc inside a workflow answers only after a push, carries no test and
      # cannot be pointed at a directory; `go run ./tools/check-design` is in
      # `CLAUDE.md`'s list and has nine tests, four of them proved by breaking
      # the real tree. It runs in `ci.yml` beside the other content checks,
      # which is where a check over `content/` belongs.
