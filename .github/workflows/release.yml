# Cutting a release, which is the one thing here that cannot be undone quietly.
#
# A tag can be deleted, but not from the machine of somebody who already fetched
# it, and not from a deployment that went out with the number stamped inside it.
# So the refusals happen first, before anything is built, and the checks that
# gate main run again on the tagged commit rather than being assumed from the
# pull request that merged it.
#
# THE IMAGE PUSH AND THE DEPLOY ARE THE LAST JOB, which is what this file said
# would happen once there was a project to push to. There is one now, and
# `infra/` built it — so the division that was a sentence is now two mechanisms:
# Terraform declares the service and ignores its image, and this decides which
# revision runs (P-07).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # First, and alone, so that a malformed tag costs twenty seconds rather than
  # a full test run.
  Tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The whole history and every tag: the check compares this tag with
          # all the others, and asks whether its commit is on main. A shallow
          # clone can answer neither.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
        env:
          GOTOOLCHAIN: local

      # checkout leaves the repository at the tag, with no branches. The check
      # asks whether the tagged commit is on main, so main has to exist locally.
      - name: Fetch main, which the tag is checked against
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: The tag is well formed, ahead of every release before it, and on main
        run: go run ./tools/release "${GITHUB_REF_NAME}"
        env:
          GOTOOLCHAIN: local

  # The same checks main is gated by — called, not copied.
  Checks:
    needs: Tag
    uses: ./.github/workflows/ci.yml

  Publish:
    needs: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creating the release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
        env:
          GOTOOLCHAIN: local

      # THE ONLY PLACE A VERSION IS WRITTEN IS THE TAG, and this is where it
      # enters the binary. Nothing in the repository carries the number, so
      # nothing in the repository can disagree with it.
      - name: The binaries, stamped with the tag they were cut from
        run: |
          set -euo pipefail
          stamp="github.com/codeschool-ing/schooling/internal/platform/build"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for command in api migrate; do
            CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w
                -X ${stamp}.Version=${GITHUB_REF_NAME}
                -X ${stamp}.Commit=${GITHUB_SHA}
                -X ${stamp}.Built=${built}" \
              -o "dist/${command}" "./cmd/${command}"
          done
        env:
          GOTOOLCHAIN: local

      # The binary agrees with the tag, asked of the binary itself. Stamping is
      # a string in a build command, which is to say the kind of thing that goes
      # wrong silently and is discovered during an incident.
      - name: The build says what the tag says
        run: |
          set -euo pipefail
          reported="$(./dist/api --version 2>/dev/null || true)"
          if [ "$reported" != "${GITHUB_REF_NAME}" ]; then
            echo "the binary reports '${reported}' and the tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
          echo "the binary reports ${reported}"

      # A RE-RUN IS NOT A SECOND RELEASE, and this step used to think it was.
      #
      # `gh release create` refuses a tag that already has a release, so once
      # this job had succeeded it could never succeed again. `Deploy` needs
      # `Publish` — so any failure AFTER this point made the deploy unreachable
      # through the workflow, permanently, no matter how the failure was fixed.
      #
      # v0.24.0 is what that costs. Its deploy failed on a missing Cloud Run job;
      # the fix was an apply that took eight seconds; and the only way back to
      # the deploy was DELETING A PUBLISHED RELEASE so that this step could
      # create it again. That is the worst recovery step in this file: it is
      # outward-facing, anybody watching the repository sees it go, and it was
      # forced by a step that is meant to be bookkeeping.
      #
      # SO IT SKIPS RATHER THAN FAILING, and skips rather than replacing. The
      # notes come from `--generate-notes` over a tag that cannot move, so a
      # release made on the first attempt and one made on the third would be
      # identical — there is nothing to bring up to date, and deleting and
      # recreating would churn a published artifact to arrive back where it
      # started.
      #
      # IT DOES NOT WEAKEN THE TAG CHECKS. `Tag` still refuses a malformed tag,
      # one that does not increase, and one that is not on main, before anything
      # is built. What is relaxed here is only "this exact release already
      # exists", which is a fact about a previous attempt at THIS tag.
      - name: The release
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "the release for ${GITHUB_REF_NAME} already exists — this is a"
            echo "re-run of a release that got this far once, not a second one."
            exit 0
          fi

          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # WHICH REVISION RUNS, WHICH IS THIS PIPELINE'S AND NOT TERRAFORM'S (P-07).
  #
  # `infra/` declares the service and then stops looking at its image —
  # `lifecycle { ignore_changes }` on exactly that field — so the two never
  # argue about it. Terraform owns what the service IS; this owns what it runs.
  #
  # ON A TAG AND NOT ON MAIN. A deploy is a release, and a release is a number
  # somebody decided to cut. Continuous deployment from main would put a version
  # of "dev" in front of students and leave the question "what is running" with
  # no answer but a commit hash.
  #
  # THERE IS NO SERVICE ACCOUNT KEY HERE, AND THERE IS NOT MEANT TO BE. GitHub
  # signs a token saying which repository is running; Google is configured to
  # believe that issuer for THIS repository only and to hand back credentials
  # that last an hour. Nothing durable exists to leak, so nothing has to be
  # rotated. See `infra/federation.tf` for the condition that makes it "this
  # repository" rather than "GitHub".
  Deploy:
    needs: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ONE DEPLOY AT A TIME, AND THE SECOND ONE WAITS RATHER THAN CANCELLING.
    #
    # Inside one run the migration and the load are sequential — each is
    # `--wait`ed on before the next step starts — so one release holds one job's
    # connection at a time. That was true of a RUN and not of the workflow: two
    # tags pushed a minute apart are two runs, and nothing stopped the second
    # one's load from starting while the first one's was still inside its
    # transaction. `infra/README.md`, "Why the limit is 8", counts a release as
    # ONE job, and this is what makes that row true.
    #
    # `cancel-in-progress: false` because cancelling a deploy halfway is the
    # state the migrate-then-load-then-revision order exists to avoid. What
    # GitHub still does is drop a PENDING run when a newer one queues behind it
    # — three tags in a row deploy the first and the last, and the middle one
    # ends cancelled. That is the right loss: it was never going to be serving.
    concurrency:
      group: deploy
      cancel-in-progress: false

    permissions:
      contents: read
      # The OIDC token the exchange is built on. It is the only reason this job
      # has any permission beyond reading the code.
      id-token: write

    # FACTS OF THE PROJECT, FROM `terraform output`. They are written here
    # rather than kept as repository variables so that a change to the
    # infrastructure and the change to this file appear in the same diff —
    # hidden configuration is the thing nobody diffs.
    env:
      REGION: us-central1
      SERVICE: schooling
      MIGRATE_JOB: schooling-migrate
      LOAD_JOB: schooling-load
      ANALYSE_JOB: schooling-analyse
      SETTLE_JOB: schooling-settle
      API_IMAGE: us-central1-docker.pkg.dev/aleogr-schooling/schooling/api
      MIGRATE_IMAGE: us-central1-docker.pkg.dev/aleogr-schooling/schooling/migrate
      LOAD_IMAGE: us-central1-docker.pkg.dev/aleogr-schooling/schooling/load
      ANALYSE_IMAGE: us-central1-docker.pkg.dev/aleogr-schooling/schooling/analyse
      SETTLE_IMAGE: us-central1-docker.pkg.dev/aleogr-schooling/schooling/settle
      DEPLOY_ACCOUNT: schooling-deploy@aleogr-schooling.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/67869214453/locations/global/workloadIdentityPools/github/providers/github
      # THE INSTANCE THE DATABASE URL POINTS AT, which is the one the
      # preflight below asks whether it is awake. It is ONE connection name,
      # not `var.database_instances`: that list is what every Cloud Run
      # resource MOUNTS, and during the move it names two instances while the
      # database lives in one of them. This workflow does not read Terraform
      # either, so the list could not reach it anyway.
      #
      # IT CHANGES TO aleogr-lab-shared-dacd:us-central1:lab-postgres WHEN THE
      # DATABASE MOVES — in the same change that points
      # `schooling-database-url` at that instance, and back if the move is
      # undone. Left behind, the preflight would ask the old instance, which
      # never sleeps, and wave a release into the window it exists to stop.
      DATABASE_CONNECTION: aleogr-schooling:us-central1:schooling

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: An hour of credentials, in exchange for a token about this repository
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}

      # NOT ASSUMED TO BE ON THE RUNNER. Whether the Google Cloud CLI ships in
      # the hosted image has changed before and is not this workflow's to bet
      # on; a deploy that fails with "gcloud: command not found" would fail
      # AFTER the images were pushed, leaving the registry ahead of the service.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # IS THE DATABASE AWAKE, asked before anything is pushed or updated.
      #
      # The instance this project is moving to sleeps four weeknights. A
      # release cut while it sleeps used to find out at the `migrate` gate,
      # with the five images already in the registry, and say so as a pgx
      # or Cloud SQL connection error that reads like a broken schema. This
      # asks first and answers in a sentence. It is aleogr/marketplace's step
      # from 2026-09-21 (`.github/workflows/terraform.yml`), made to do the
      # same job in front of a deploy.
      #
      # THE FIRST THING THIS JOB DOES, AFTER THE TWO STEPS THAT GIVE IT
      # CREDENTIALS. Nothing can be asked of Google before those, and
      # everything after this is a change: the registry login, the images, the
      # jobs, the revision.
      #
      # A READ THAT FAILS IS NOT AN ANSWER. `policy=$(gcloud ...)` on its own
      # line would stop the step at the assignment under `-e`, printing
      # gcloud's error and nothing that says what it means. `if ! policy=$(...)`
      # tests the read itself, so the sentence below can print. An empty
      # answer gets the same treatment: nothing read is not the same as ALWAYS.
      #
      # IT READS AND NEVER WAKES. Starting an instance is
      # `cloudsql.instances.update`, which the shared project does not give
      # this repository, because it is also the permission that would stop an
      # instance other projects use. The read is `cloudsql.instances.get`:
      # `deploy_reads_the_database_state` in `infra/iam.tf` here, and
      # `roles/cloudsql.viewer` granted by the shared project after the move.
      #
      # WHAT IT DOES NOT SEE: the policy turns ALWAYS the moment the instance
      # is told to start at 07:30, and the database accepts connections about
      # twelve minutes later. A release in those minutes passes this and can
      # still fail at `migrate`. That is why the message says 07:45 and not
      # 07:30.
      - name: The database is awake
        run: |
          set -euo pipefail

          IFS=: read -r project region instance extra <<< "$DATABASE_CONNECTION"
          if [ -z "$project" ] || [ -z "$region" ] || [ -z "$instance" ] || [ -n "$extra" ]; then
            echo "::error::DATABASE_CONNECTION is '${DATABASE_CONNECTION}', which is not project:region:instance, so there is no instance to ask."
            exit 1
          fi

          if ! policy=$(gcloud sql instances describe "$instance" \
              --project="$project" --format='value(settings.activationPolicy)'); then
            echo "::error::The instance ${DATABASE_CONNECTION} could not be read, so this deploy cannot tell whether the database is awake. Nothing has been pushed."
            exit 1
          fi

          echo "activationPolicy=${policy:-(nothing)} for ${DATABASE_CONNECTION}"

          if [ -z "$policy" ]; then
            echo "::error::The instance ${DATABASE_CONNECTION} could not be read: gcloud answered with no activationPolicy, which is not the same as the instance being asleep. Nothing has been pushed."
            exit 1
          fi

          if [ "$policy" != "ALWAYS" ]; then
            echo "::error::The shared database sleeps Monday–Thursday 22:00–07:30 (America/Sao_Paulo) and takes about 12 minutes to wake; release after 07:45 or on another day."
            exit 1
          fi

      - name: The registry, as somewhere docker may push
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # EVERYTHING THIS DEPLOY WILL TOUCH, CHECKED BEFORE IT TOUCHES ANY OF IT.
      #
      # This is the step above's argument one stage further along, and it is
      # here because the further stage actually happened. Terraform declares the
      # service and the four jobs (P-07); this pipeline only ever UPDATES them,
      # and an update against a resource nobody applied fails. That much is
      # correct. WHERE it failed was the problem: v0.24.0 found
      # `schooling-settle` missing after it had already migrated the schema and
      # loaded the catalogue, and then skipped the revision — leaving production
      # on the new schema with the old code, which is a state the
      # migrate-before-traffic order is built to survive and which nobody chose.
      #
      # A deploy that cannot finish should find that out while it has changed
      # nothing.
      #
      # THE REMEDY IS NAMED, because `could not be found` does not say it. The
      # resource is not missing from this repository — it is declared in
      # `infra/` and waiting on an apply that a person runs from a terminal, and
      # a release is exactly when nobody remembers that a Terraform resource
      # arrived in the same pull request as the step that uses it.
      #
      # IT DESCRIBES RATHER THAN LISTS. `roles/run.admin` covers both, but a
      # `describe` per name says which one is absent; a list would have to be
      # matched against these variables here, which is a second place for a name
      # to be spelled.
      - name: Everything this deploy updates already exists
        run: |
          set -euo pipefail

          missing=()
          for job in "$MIGRATE_JOB" "$LOAD_JOB" "$ANALYSE_JOB" "$SETTLE_JOB"; do
            gcloud run jobs describe "$job" --region "$REGION" >/dev/null 2>&1 \
              || missing+=("job ${job}")
          done
          gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1 \
            || missing+=("service ${SERVICE}")

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "this deploy would update something that is not there:"
            printf '  %s\n' "${missing[@]}"
            echo
            echo "infra/ declares these and Terraform creates them. Against"
            echo "${CLOUDSDK_CORE_PROJECT:-the project}, run"
            echo
            echo "    terraform -chdir=infra apply"
            echo
            echo "and then re-run this job. Nothing has been changed."
            exit 1
          fi

          echo "the service and all four jobs are there"

      # THE GO VERSION COMES FROM go.mod, here as everywhere else. Passed into
      # the build rather than written in the Dockerfile, so a directive that
      # moves cannot leave an image behind on an older compiler.
      # ONE OF THEM CARRIES THE CATALOGUE, which is why it is built against a
      # different target: `cmd/load` reads `content/` off a filesystem, and the
      # others never open it. See `deploy/Dockerfile`.
      - name: The five images, stamped with the tag they were cut from
        run: |
          set -euo pipefail
          go_version="$(awk '/^go /{print $2}' go.mod)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for command in api migrate load analyse settle; do
            case "$command" in
              api)     image="$API_IMAGE";     target=binary ;;
              migrate) image="$MIGRATE_IMAGE"; target=binary ;;
              load)    image="$LOAD_IMAGE";    target=with-content ;;
              analyse) image="$ANALYSE_IMAGE"; target=binary ;;
              settle)  image="$SETTLE_IMAGE";  target=binary ;;
            esac

            docker build \
              --file deploy/Dockerfile \
              --target "$target" \
              --build-arg "GO_VERSION=${go_version}" \
              --build-arg "COMMAND=${command}" \
              --build-arg "VERSION=${GITHUB_REF_NAME}" \
              --build-arg "COMMIT=${GITHUB_SHA}" \
              --build-arg "BUILT=${built}" \
              --tag "${image}:${GITHUB_REF_NAME}" \
              .
            docker push "${image}:${GITHUB_REF_NAME}"
          done

      # THE MIGRATION RUNS TO COMPLETION BEFORE ANY TRAFFIC REACHES THE NEW
      # REVISION, which is the whole reason it is a job and not something the
      # container does on the way up. `--wait` is what makes this a gate: it
      # blocks until the execution finishes and exits non-zero if it failed, so
      # a schema that did not apply stops the deploy instead of meeting it.
      - name: The schema, applied and waited for
        run: |
          set -euo pipefail
          gcloud run jobs update "$MIGRATE_JOB" \
            --region="$REGION" \
            --image="${MIGRATE_IMAGE}:${GITHUB_REF_NAME}" \
            --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region="$REGION" --wait

      # AFTER THE SCHEMA AND BEFORE THE REVISION, for the same reason the
      # migration is before both: a revision that starts serving a catalogue
      # older than itself shows a student a course that is not there any more,
      # or misses one that is.
      #
      # IT WRITES NOTHING IF THE CATALOGUE DOES NOT PASS. `cmd/load` validates
      # first and refuses whole — so a failure here leaves the PREVIOUS
      # catalogue serving, which is the state worth having when something is
      # wrong with the new one.
      - name: The catalogue, from the files into the mirror
        run: |
          set -euo pipefail
          gcloud run jobs update "$LOAD_JOB" \
            --region="$REGION" \
            --image="${LOAD_IMAGE}:${GITHUB_REF_NAME}" \
            --quiet
          gcloud run jobs execute "$LOAD_JOB" --region="$REGION" --wait

      # THE NIGHTLY ANALYSIS IS UPDATED AND NOT EXECUTED, which is the one
      # difference between this job and the two above it. The other two are
      # gates — a schema that has not applied and a catalogue that has not
      # loaded are deploys that have not happened — and this one is a thing the
      # clock does at ten past three. Running it here would put a second set of
      # numbers into the same night for no reason other than that somebody cut
      # a release, and `cmd/analyse` WITHDRAWS questions from circulation: it is
      # not a report to fire off casually.
      #
      # It is also not `--wait`ed on, because nothing is waiting for it.
      - name: The nightly analysis, pointed at the new image
        run: |
          set -euo pipefail
          gcloud run jobs update "$ANALYSE_JOB" \
            --region="$REGION" \
            --image="${ANALYSE_IMAGE}:${GITHUB_REF_NAME}" \
            --quiet

      # AND THE NIGHTLY SETTLING. Neither of these is EXECUTED here — they are
      # pointed at the new image and the scheduler runs them tonight. Running
      # them now would make a deploy do a night's work at a time nobody chose,
      # which is what `migrate` and `load` are for and these two deliberately
      # are not: one withdraws questions from in front of students and the other
      # writes an ending into an append-only stream.
      - name: The nightly settling, pointed at the new image
        run: |
          set -euo pipefail
          gcloud run jobs update "$SETTLE_JOB" \
            --region="$REGION" \
            --image="${SETTLE_IMAGE}:${GITHUB_REF_NAME}" \
            --quiet

      - name: The revision
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --region="$REGION" \
            --image="${API_IMAGE}:${GITHUB_REF_NAME}" \
            --quiet

      # ASKED OF THE THING THAT IS RUNNING, not of the thing that was pushed.
      # The Publish job proves a binary can be stamped; this proves the stamped
      # one is the one answering on the address, which is a different claim and
      # the one that matters during an incident.
      - name: What is running says which release it is
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.url)')"

          reported="$(curl -fsS "${url}/version" | jq -r .version)"
          if [ "$reported" != "${GITHUB_REF_NAME}" ]; then
            echo "the deployed revision reports '${reported}' and the tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
          echo "${url} is serving ${reported}"
