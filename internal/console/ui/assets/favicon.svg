<!-- The staff console, which is a games controller. The pun is deliberate.

     REDRAWN AND NOT TRACED. What arrived was a JPEG of a neon sign: a grid of
     pixels with a glow, and a glow is the first thing to disappear at the
     sixteen pixels a favicon is actually seen at. So the shape is a stroke
     again, in the same weight and the same blue as the rest — which is what
     makes these look like one family rather than five downloads.

     THE BOX IS GONE AND THE CONTROLLER STAYED, which is the opposite of the
     first two attempts and better than both. The image has a console with a
     controller on a cable in front of it; two objects joined by a line is more
     than sixteen pixels can hold, and it came out a smudge. A box on its own
     survives the size and says nothing — at sixteen pixels it is a rectangle
     that could be a router, a drawer or a battery.

     A CONTROLLER IS ONE OBJECT WITH A SILHOUETTE NOBODY MISREADS. The d-pad and
     the buttons vanish at the smallest size and the outline still says what it
     is, which is the only thing an icon has to do there.

     Three versions were drawn and looked at side by side at 128, 32 and 16
     before this one was chosen. That comparison cannot be made any other way,
     and it is why these were rendered rather than reasoned about. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="r"><rect width="64" height="64" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0a0e14"/>
    <g fill="none" stroke="#5b8cff" stroke-width="4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 21 h16 a15 15 0 0 1 13.6 21.3 l-2.4 5.2 a5 5 0 0 1 -8.8 .5 L38 40 H26 l-4.4 8 a5 5 0 0 1 -8.8 -.5 l-2.4 -5.2 A15 15 0 0 1 24 21 z"/>
      <path d="M18 31 v7 M14.5 34.5 h7"/>
      <circle cx="43" cy="31.5" r="2.3"/>
      <circle cx="47.5" cy="36" r="2.3"/>
    </g>
  </g>
</svg>
