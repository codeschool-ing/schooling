<!-- The staff console. The pun is deliberate and it is a console.

     REDRAWN AND NOT TRACED. What arrived was a JPEG of a neon sign: a grid of
     pixels with a glow, and a glow is the first thing to disappear at the
     sixteen pixels a favicon is actually seen at. So the shape is a stroke
     again, in the same weight and the same blue as the rest — which is what
     makes these look like one family rather than four downloads.

     THE CONTROLLER IS THE EXPENSIVE PART AND IT IS HERE ON PURPOSE. Two objects
     with a cable between them is more than sixteen pixels can hold: at that
     size this is a smudge, and a version without the controller stays legible
     all the way down. Both were drawn and looked at side by side before this
     one was chosen, which is the only way that comparison can be made. The
     other is one file away. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="r"><rect width="64" height="64" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0a0e14"/>
    <g fill="none" stroke="#5b8cff" stroke-width="3.2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 20 L15 10 H49 L55 20"/>
      <path d="M9 20 v10 a3 3 0 0 0 3 3 h18"/>
      <path d="M55 20 v10 a3 3 0 0 1 -3 3 h-6"/>
      <circle cx="18" cy="26" r="2.2"/>
      <circle cx="26" cy="26" r="2.2"/>
      <path d="M47 22 V25"/>
      <path d="M44.5 25 a3.4 3.4 0 1 0 5 0"/>
      <path d="M46 33 q0 6 -6 6 h-2"/>
      <path d="M25 39 h14 a9 9 0 0 1 8 12.6 a4 4 0 0 1 -6.9 .9 L37.5 49 h-11 l-2.6 3.5 a4 4 0 0 1 -6.9 -.9 A9 9 0 0 1 25 39 z"/>
    </g>
  </g>
</svg>
