<!-- The staff console. The pun is deliberate and it is a console.

     REDRAWN AND NOT TRACED. What arrived was a JPEG of a neon sign: a grid of
     pixels with a glow, and a glow is the first thing to disappear at the sixteen
     pixels a favicon is actually seen at. So the shape is a stroke again, in the
     same weight and the same blue as `favicon.svg` — which is what makes these
     look like one family rather than four downloads.
     THE CONTROLLER IS GONE, and that is the whole lesson of drawing these. The
     original carries a cable and a gamepad below the box; at sixteen pixels the
     two fused into one smudge and neither was readable. A box with two buttons
     and a power symbol survives; a box with a controller does not. Rendering it
     at the size it is used at is the only way that is ever discovered. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="r"><rect width="64" height="64" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0a0e14"/>
    <g fill="none" stroke="#5b8cff" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 27 L20 17 H44 L51 27"/>
      <rect x="12.5" y="27" width="39" height="18" rx="5"/>
      <circle cx="23" cy="36" r="3"/>
      <circle cx="33" cy="36" r="3"/>
      <path d="M43 32.5 V36"/>
      <path d="M39.8 36 a4.4 4.4 0 1 0 6.4 0"/>
    </g>
  </g>
</svg>
