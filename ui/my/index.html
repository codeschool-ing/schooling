<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- A PERSONAL ADDRESS IS NOT A SEARCH RESULT. Everything here is one student's
     own, behind a session; there is nothing for a crawler to index and nothing
     it could reach. -->
<meta name="robots" content="noindex, nofollow" />

<!-- THE TAB IS THE ADDRESS, cut to the part that differs — the study
     interface's rule and the console's. One deployment answers for every
     school, for the console and for this, so what a person with four of these
     open needs from a tab is WHICH ONE. -->
<title>my.schooling</title>
<script>try{var l=location.hostname.split('.');
  if(l.length>1)document.title=l[0]+'.'+l[1]}catch(e){}</script>

<meta name="description" content="What is due today, everywhere you practise." />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

<!-- The saved theme before paint, avoiding the flash.

     IT WILL USUALLY FIND NOTHING, and that is a property of the web rather than
     a defect here: `localStorage` is per ORIGIN, so a student who chose the
     light theme at their school chose it at THAT origin. This address starts on
     the default and remembers its own choice from then on. The session crosses,
     because a cookie can be scoped to the parent domain; a stored preference
     cannot. -->
<script>try{if(localStorage.getItem('codeschool-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>

<!-- Containers the i18n must NOT map on load: they rebuild themselves from the
     data, calling txt() at render time. Here that is the whole page below the
     bar. -->
<script>window.I18N_DYNAMIC = ['#here'];</script>

<!-- THE TYPE, served from here rather than from a font CDN, and the same files
     the study interface uses — out of its embed, not a copy. Without this
     base.css asks for 'IBM Plex Sans' and gets whatever the system has. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css" />

<!-- base.css is the study interface's stylesheet, the SAME BYTES. There is no
     copy of it here; see ui/mine.go. mine.css adds the little this place needs
     and the study interface has no use for. -->
<link rel="stylesheet" href="/assets/base.css" />
<link rel="stylesheet" href="/assets/mine.css" />
</head>
<body class="mine-body">

<!-- THE SAME BAR AS EVERYTHING ELSE IN THIS ORGANISATION: fixed, 64px, the
     brand at the left.

     THE BRAND IS THE PLATFORM AND NOT A SCHOOL, for the console's reason. A
     school's name on this bar would be the first place somebody reads the wrong
     scope — the whole point of the address is that it belongs to none of
     them. -->
<nav>
  <a href="/" class="brand"><span class="led"></span><span class="brand-name">schooling</span></a>
  <span class="bar-label mono">Mine</span>
  <span class="bar-spacer"></span>
  <button id="theme" class="icon-btn" type="button" aria-label="Switch theme"></button>
</nav>

<main id="here" aria-live="polite">
  <p class="checking">Reading…</p>
</main>

<script src="/assets/i18n.js"></script>
<!-- THIS PLACE'S OWN PORTUGUESE, and not the study interface's.

     It is a separate dictionary rather than more lines in that one because the
     two interfaces say different things: sharing would make every string of one
     read as a stale entry to the other, which is exactly what
     `check-interface` reports and exactly what it is for. CI runs it against
     this directory as a second invocation. -->
<script src="/assets/i18n-pt.js"></script>
<script src="/assets/i18n-runtime.js"></script>

<script type="module" src="/app/main.js"></script>
</body>
</html>
