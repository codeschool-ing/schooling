<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- THE ONE ADDRESS ON THIS PLATFORM THAT WANTS TO BE FOUND, which is the
     opposite of every other and worth saying rather than leaving to the
     absence of a tag. `my.` is one student's own and asks not to be indexed;
     the console is staff software; a school is public but is one school. This
     is the door, and a door nobody can find is a wall. -->
<meta name="robots" content="index, follow" />

<!-- THE TAB IS THE ADDRESS, cut to the part that differs — every interface in
     this organisation does this, for the same reason: one deployment answers
     for the schools, the console, a student's own place and this, and what
     somebody with four tabs open needs is WHICH ONE. -->
<title>schooling</title>
<script>try{var l=location.hostname.split('.');
  if(l.length>1)document.title=l[0]+'.'+l[1]}catch(e){}</script>

<meta name="description" content="Schools that teach one subject properly, each on its own address." />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

<!-- The saved theme before paint, avoiding the flash. It will usually find
     nothing, for `my.`'s reason: `localStorage` is per ORIGIN, and somebody
     arriving here has not been here before. That is more true at this address
     than at any other — being somebody's first request is what it is for. -->
<script>try{if(localStorage.getItem('codeschool-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>

<!-- Containers the i18n must NOT map on load: they rebuild themselves from the
     data, calling txt() at render time. Here that is the whole page below the
     bar — which is empty today and is the point of this file. -->
<script>window.I18N_DYNAMIC = ['#here'];</script>

<!-- THE TYPE, served from here rather than from a font CDN, and the same files
     every other interface uses — out of the study interface's embed, not a
     copy. Without this base.css asks for 'IBM Plex Sans' and gets whatever the
     system has. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css" />

<!-- base.css is the study interface's stylesheet, the SAME BYTES. There is no
     copy of it here; see ui/front.go. front.css adds the little this place
     needs and nothing else has a use for. -->
<link rel="stylesheet" href="/assets/base.css" />
<link rel="stylesheet" href="/assets/front.css" />
</head>
<body class="front-body">

<!-- THE SAME BAR AS EVERYTHING ELSE IN THIS ORGANISATION: fixed, 64px, the
     brand at the left. Here the brand is not a scope decision the way it is on
     `my.` and the console — this address IS the platform, so the name in the
     bar and the name of the thing are the same for once. -->
<nav>
  <a href="/" class="brand"><span class="led"></span><span class="brand-name">schooling</span></a>
  <span class="bar-spacer"></span>
  <button id="theme" class="icon-btn" type="button" aria-label="Switch theme"></button>
</nav>

<!-- AND NOTHING ELSE YET, DELIBERATELY.

     What belongs on the platform's front page is not decided, and a page that
     guessed would be a design nobody agreed to, sitting at the most public
     address this platform has. What IS decided is everything around it: which
     host answers, which tree is served, that it is indexable, that it asks
     nothing of anybody. That is what this file is for, and the page it frames
     is written next. -->
<main id="here" aria-live="polite"></main>

<script src="/assets/i18n.js"></script>
<!-- THIS PLACE'S OWN PORTUGUESE. A separate dictionary rather than more lines
     in the study interface's, for the reason `my.`'s header gives: two
     interfaces saying different things would each read as stale entries to the
     other, which is what `check-interface` reports and what it is for. CI runs
     it against this directory as a third invocation. -->
<script src="/assets/i18n-pt.js"></script>
<script src="/assets/i18n-runtime.js"></script>

<script type="module" src="/app/main.js"></script>
</body>
</html>
