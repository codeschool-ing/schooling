<!-- The platform itself: the LED.

     NOT A NEW DRAWING. `base.css` puts a nine-pixel dot in `--phosphor` beside
     the brand in every shell this organisation serves, and it blinks. This is
     that dot, which means the tab and the page agree without anybody having
     decided they should.

     IT IS ALSO THE ONE SHAPE THAT CANNOT BLUR. A favicon is sixteen pixels and
     a filled circle is legible at four — which matters here more than anywhere,
     because this is the mark every school without one of its own falls back to.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="r"><rect width="64" height="64" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0a0e14"/>
    <circle cx="32" cy="32" r="17" fill="none" stroke="#33549e" stroke-width="3"/>
    <circle cx="32" cy="32" r="9" fill="#5b8cff"/>
  </g>
</svg>
