<!-- The platform itself: the LED.

     NOT A NEW DRAWING. base.css puts a nine-pixel dot in the phosphor blue
     beside the brand in every shell this organisation serves, and it blinks.
     This is that dot, which means the tab and the page agree without anybody
     having decided they should.

     IT IS ALSO THE ONE SHAPE THAT CANNOT BLUR. A favicon is sixteen pixels and
     a filled circle is legible at four, which matters here more than anywhere:
     this is the mark every school without one of its own falls back to.

     AND THE COLOUR IS NOT NAMED WITH ITS CSS SPELLING, which is not fussiness.
     A pair of hyphens is forbidden inside an XML comment, so writing the custom
     property here made this file invalid — a browser drew it anyway and GitHub,
     which parses strictly, refused it with "invalid image source". It rendered
     everywhere it was looked at and was broken everywhere it was not. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="r"><rect width="64" height="64" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0a0e14"/>
    <circle cx="32" cy="32" r="17" fill="none" stroke="#33549e" stroke-width="3"/>
    <circle cx="32" cy="32" r="9" fill="#5b8cff"/>
  </g>
</svg>
