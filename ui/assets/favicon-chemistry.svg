<!-- Chemistry: a flask, with a line where the liquid is.

     REDRAWN AND NOT TRACED. What arrived was a JPEG of a neon sign: a grid of
     pixels with a glow, and a glow is the first thing to disappear at the sixteen
     pixels a favicon is actually seen at. So the shape is a stroke again, in the
     same weight and the same blue as `favicon.svg` — which is what makes these
     look like one family rather than four downloads. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="r"><rect width="64" height="64" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0a0e14"/>
    <g fill="none" stroke="#5b8cff" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 13 h18"/>
      <path d="M27 13 v13 L13.5 47 a4.5 4.5 0 0 0 4 7 h29 a4.5 4.5 0 0 0 4 -7 L37 26 V13"/>
      <path d="M19 40 h26"/>
    </g>
  </g>
</svg>
