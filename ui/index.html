<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schooling</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

<!-- The saved theme, applied before the first paint so it does not flash.
     It runs here rather than in app.js because app.js is a module and modules
     are deferred: by the time one runs, the page has been painted in whatever
     theme the markup said. It reads the pre-rename key too — the one read a
     returning student gets, and missing it shows them a frame of the theme they
     turned off. app.js does the writing back. -->
<script>
try {
  var t = localStorage.getItem('codeschool-theme')
       || { claro: 'light', escuro: 'dark' }[localStorage.getItem('codeschool-tema')];
  document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
} catch (e) { /* private mode: the markup's default stands */ }
</script>

<!-- THE TYPE IS SERVED FROM HERE, not from a font CDN. A student should not have
     to tell a third party which school they are reading before the page has
     rendered; the offline bundle is one file with no network to fetch a family
     over; and two machines rendering different fonts measure different cards,
     which is a graph test that fails on the build machine and nowhere else.
     The faces and this stylesheet are written by `go run ./tools/fonts`.

     The three families they provide — IBM Plex Sans, IBM Plex Mono and Space
     Grotesk — are exactly the three the two stylesheets below ask for, which is
     what let those be copied without touching a line. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css" />

<!-- THE TWO STYLESHEETS ARE THE STUDENT PORTAL'S, COPIED.
     `base.css` is the shared identity — the same file as
     `codeschool-ing.github.io/assets/style.css` and `portal-frontend`'s and
     `console-frontend`'s `assets/base.css`, byte for byte.
     `portal.css` is `portal-frontend/assets/portal.css`, also byte for byte:
     the rail, the cards, the blocks, the graph, the certificate.

     THEY ARE COPIES AND MUST STAY COPIES. This interface used to have a layout
     of its own, written to the same palette, and the two drifted in every
     direction a person cannot see from a screenshot — spacing, weights, the
     size of a meter. Two files kept identical are a diff away from agreeing;
     two files written to look alike are a conversation.

     `app.css` is what is left: the handful of things this application has and
     the portal does not. It is loaded last so it can only add. -->
<link rel="stylesheet" href="/assets/base.css" />
<link rel="stylesheet" href="/assets/portal.css" />
<link rel="stylesheet" href="/assets/app.css" />
</head>

<body class="portal-body">

<!-- The first thing in the tab order and the first thing a screen reader
     reaches. It is not decoration: every screen here puts a rail of the same
     twenty links before the content, and without this a keyboard user tabs
     through all of them on every navigation. (WCAG 2.4.1)

     THE PORTAL HAS NO SKIP LINK AND THIS ONE KEEPS IT. Copying a layout is not
     a reason to drop an affordance the layout does not happen to include. -->
<a class="skip" href="#content">Skip to content</a>

<nav>
  <a href="#/dashboard" class="brand">
    <span class="led"></span><span class="brand-name" id="school-name">Schooling</span>
  </a>

  <button class="rail-btn" id="rail-btn" aria-label="Open navigation" aria-expanded="false">≡</button>

  <div class="nav-context" id="nav-context"></div>

  <div class="nav-actions">
    <button id="search-btn" class="nav-icon" aria-label="Search courses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    </button>

    <!-- THE PORTAL'S SEARCH IS A ⌘K PANEL and this is a field in the bar. It is
         the one piece of the chrome that is not the copy: the panel is its own
         component over there (`app/search-panel.js`) and porting it is a
         separate piece of work. The button, its name and the way it opens are
         the same; what appears is smaller. -->
    <form class="search" id="search" role="search">
      <label class="visually-hidden" for="search-input">Search</label>
      <input id="search-input" type="search" autocomplete="off"
             placeholder="Search courses and lessons" />
    </form>

    <button id="theme-btn" class="theme" aria-label="Theme">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
    </button>

    <div class="lang" id="lang">
      <button class="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
        <span id="lang-short">EN</span>
      </button>
      <div class="lang-menu" id="lang-menu" role="menu"></div>
    </div>

    <!-- The way in, for somebody who has not come in yet. The portal has no
         equivalent because a signed-out visitor never reaches it; here the
         catalogue is open to everybody (N-04), so this bar has to serve both. -->
    <a class="btn btn-primary" id="sign-in-link" href="#/sign-in">Sign in</a>

    <div class="account" id="account" hidden>
      <button class="account-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Your account">
        <span class="account-avatar" id="account-avatar">·</span>
        <span class="visually-hidden" id="account-name">You</span>
      </button>
      <div class="account-menu" id="account-menu" role="menu"></div>
    </div>
  </div>
</nav>

<div class="portal">
  <!-- The rail answers "where am I" and "how much is left" without a click.
       Outside a course it is the navigation with the track below it; inside
       one, the lessons. Filled by app.js. -->
  <aside class="rail" id="rail" aria-label="Navigation"></aside>
  <div class="rail-veil" id="rail-veil" hidden></div>

  <!-- One element, filled by the router. `tabindex="-1"` so that the skip link
       and the router can move focus here — which is also what announces a new
       screen, since a fragment router changes the page without a page load and
       nothing announces that on its own.

       DELIBERATELY NOT `aria-live`. A live region announces its changes, and
       this element's change is the entire page: a screen reader would read the
       whole thing out on every navigation, on top of the heading it has just
       been moved to. Moving focus says "you are somewhere new" in one line
       instead of in fifty. -->
  <main class="content" id="content" tabindex="-1"></main>
</div>

<!-- THE TWO DOCUMENTS, ON EVERY SCREEN. A privacy policy nobody can find is not
     published, and the bottom of the page is where people look for one.

     It is OUTSIDE `#content`, so the router never clears it: a link that
     disappeared on the sign-up form would be missing from the one screen where
     somebody is about to hand over an e-mail address. That also means it is
     translated by the same walk over the document as the bar, with no entry of
     its own to keep in step.

     The portal has no footer either — see the skip link. -->
<footer class="page-footer">
  <nav aria-label="Legal">
    <a href="#/terms">Terms of use</a>
    <a href="#/privacy">Privacy policy</a>
  </nav>
</footer>

<script src="/assets/i18n-pt.js"></script>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
