<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="A packet drawn as one long bar. Four unlabelled fields make up the header on the left, and one wide unlabelled area on the right is the payload. Each field shows only its value, so the names have to be placed by the reader.">
  <text x="360" y="26" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="var(--paper)">One packet, with the names taken off</text>

  <rect x="18" y="62" width="470" height="76" rx="3" fill="var(--phosphor)" fill-opacity="0.06" stroke="var(--phosphor)" stroke-width="1.5"></rect>
  <rect x="492" y="62" width="210" height="76" rx="3" fill="var(--panel)" stroke="var(--wire)" stroke-width="1.5"></rect>

  <rect x="24" y="70" width="108" height="60" rx="2" fill="var(--panel)" stroke="var(--wire)"></rect>
  <text x="78" y="100" text-anchor="middle" dominant-baseline="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--paper)">198.51.100.4</text>

  <rect x="140" y="70" width="108" height="60" rx="2" fill="var(--panel)" stroke="var(--wire)"></rect>
  <text x="194" y="100" text-anchor="middle" dominant-baseline="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--paper)">203.0.113.7</text>

  <rect x="256" y="70" width="108" height="60" rx="2" fill="var(--panel)" stroke="var(--wire)"></rect>
  <text x="310" y="100" text-anchor="middle" dominant-baseline="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--paper)">1500</text>

  <rect x="372" y="70" width="108" height="60" rx="2" fill="var(--panel)" stroke="var(--wire)"></rect>
  <text x="426" y="100" text-anchor="middle" dominant-baseline="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--paper)">58</text>

  <text x="597" y="94" text-anchor="middle" dominant-baseline="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--paper-dim)">...a slice of what</text>
  <text x="597" y="112" text-anchor="middle" dominant-baseline="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="var(--paper-dim)">is being sent...</text>

  <text x="253" y="164" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="var(--phosphor)">read at every hop</text>
  <text x="597" y="164" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="var(--paper-dim)">read only at the end</text>
  <text x="360" y="206" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="var(--paper-dim)">each box below the values is waiting for its name</text>
</svg>
