name: shop
version: "1.0"
profile: ponto_final            # which entry of ~/.dbt/profiles.yml to connect with

flags:
  send_anonymous_usage_stats: false
  use_colors: false

models:
  shop:
    staging:                    # everything under models/staging
      +schema: staging
      +materialized: view
    marts:                      # everything under models/marts
      +schema: marts
      +materialized: table
