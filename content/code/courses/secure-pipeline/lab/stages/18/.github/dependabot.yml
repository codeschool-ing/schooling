# Version updates for linkbox: which dependencies GitHub's Dependabot keeps
# current, when it may open a pull request, and how long a release must have
# been public before it is proposed. Security updates do not wait for any of
# this; they come when an advisory does.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      python:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
