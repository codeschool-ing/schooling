# The usual cluster, plus one port of the laptop: 8080 reaches port 30080 of
# the control-plane node, which is where a NodePort Service of that number
# answers. Lessons 8 and 15 use it to reach the shop from outside the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri"]
    restrict_oom_score_adj = true
kubeadmConfigPatches:
- |
  kind: KubeletConfiguration
  failCgroupV1: false
  serverTLSBootstrap: true
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8080
- role: worker
- role: worker
