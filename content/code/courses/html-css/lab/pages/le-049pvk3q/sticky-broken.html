<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixed and sticky · Andorinha Books</title>
    <style>
      body { margin: 0; font: 16px/1.5 sans-serif; }
      .chat {
        position: fixed;
        right: 16px;
        bottom: 16px;
        padding: 8px 16px;
        background: #2f6f4e;
        color: white;
      }
      .month h2 {
        position: sticky;
        top: 0;
        margin: 0;
        padding: 8px;
        background: #f4f1ea;
      }
      .month { height: 900px; }
      .wrapper { overflow: hidden; }
    </style>
  </head>
  <body>
    <div class="wrapper">
    <section class="month" id="october">
      <h2>October</h2>
      <p>Poetry reading, book swap and a bookbinding class.</p>
    </section>
    <section class="month" id="november">
      <h2>November</h2>
      <p>Nothing is planned yet.</p>
    </section>
    </div>
    <a class="chat" href="contact.html">Ask us</a>
  </body>
</html>
