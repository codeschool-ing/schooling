<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Overlay · Andorinha Books</title>
    <style>
      body { margin: 0; font: 16px/1.5 sans-serif; }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 0.5);
      }
      .notice {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 300px;
        height: 200px;
        padding: 16px;
        box-sizing: border-box;
        background: white;
      }
    </style>
  </head>
  <body>
    <main><h1>Events</h1></main>
    <div class="overlay">
      <div class="notice">
        <p>The shop is closed on 12 October for a public holiday.</p>
      </div>
    </div>
  </body>
</html>
