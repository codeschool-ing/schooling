services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_USER: bookshop
      POSTGRES_PASSWORD: ${BOOKSHOP_DB_PASSWORD:?set BOOKSHOP_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bookshop", "-d", "bookshop"]
      interval: 2s
      retries: 15

  app:
    build: .
    image: bookshop:0.1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bookshop
      SPRING_DATASOURCE_PASSWORD: ${BOOKSHOP_DB_PASSWORD}
      BOOKSHOP_JWT_SECRET: ${BOOKSHOP_JWT_SECRET:?set BOOKSHOP_JWT_SECRET}
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      retries: 20

volumes:
  db-data:
